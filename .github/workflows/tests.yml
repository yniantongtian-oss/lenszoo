name: tests

on:
  push:
    branches: [main, upgrade/reliability-20261011]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest -q
      - name: Corpus audit
        run: lenszoo audit
      - name: Quickstart
        env:
          MPLBACKEND: Agg
        run: python examples/quickstart.py
