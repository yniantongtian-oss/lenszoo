name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "optiland==0.6.2"
          pip install -e ".[dev]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest -q
      - name: Quickstart
        env:
          MPLBACKEND: Agg
        run: python examples/quickstart.py
