name: tests

on:
  push:
    branches: [main, upgrade/reliability-20261011]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "optiland==0.6.2"
          pip install -e ".[dev]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest -q
      - name: Quickstart
        env:
          MPLBACKEND: Agg
        run: python examples/quickstart.py
